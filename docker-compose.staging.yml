# Coolify Staging Stack for FreightLens
services:
  postgres-staging:
    image: postgres:16-alpine
    container_name: postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: containermgmt_pg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - freightlens_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d containermgmt_pg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  rustfs-staging:
    image: rustfs/rustfs:latest
    container_name: rustfs-staging
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=false
    volumes:
      - freightlens_staging_rustfs:/data
    networks:
      - coolify

  meilisearch-staging:
    image: getmeili/meilisearch:v1.6
    container_name: meilisearch-staging
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - freightlens_staging_meili:/meili_data
    networks:
      - coolify

  backend-staging:
    build:
      context: https://github.com/FusionTec-sey/FreightLens_Backend.git#standalone-main
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - MEDIA_SIGNING_KEY=${MEDIA_SIGNING_KEY:?MEDIA_SIGNING_KEY is required}
      - CMA_CGM_WEBHOOK_SECRET=${CMA_CGM_WEBHOOK_SECRET:?CMA_CGM_WEBHOOK_SECRET is required}
      - JWT_ALGORITHM=HS256
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=${FRONTEND_URL}
      - HOST_IP=0.0.0.0
      - HOST_PORT=6051
      - RUSTFS_ENDPOINT_URL=http://rustfs-staging:9000
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      - RUSTFS_BUCKET_NAME=containermgmt-blobs
      - RUSTFS_REGION=us-east-1
      - MEILISEARCH_URL=http://meilisearch-staging:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    depends_on:
      postgres-staging:
        condition: service_healthy
      rustfs-staging:
        condition: service_started
      meilisearch-staging:
        condition: service_started
    labels:
      - "coolify.managed=true"

  frontend-staging:
    build:
      context: https://github.com/FusionTec-sey/FreightLens_Frontend.git#standalone-main
      dockerfile: Dockerfile
      args:
        - REACT_APP_NETWORK=${BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend-staging
    labels:
      - "coolify.managed=true"

volumes:
  freightlens_staging_pgdata:
  freightlens_staging_rustfs:
  freightlens_staging_meili:

networks:
  coolify:
    name: coolify
    external: true
