name: Backend tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: containermgmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d containermgmt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/containermgmt_test
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/containermgmt_test
      DISABLE_SCHEDULER: "1"
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-production
      MEDIA_SIGNING_KEY: test-media-signing-key-not-for-production
      CMA_CGM_WEBHOOK_SECRET: test-webhook-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
