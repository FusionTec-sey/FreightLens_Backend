name: Backend tests

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: containermgmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d containermgmt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/containermgmt_test
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/containermgmt_test
      DISABLE_SCHEDULER: "1"
      ENVIRONMENT: test
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-production
      MEDIA_SIGNING_KEY: test-media-signing-key-not-for-production
      CMA_CGM_WEBHOOK_SECRET: test-webhook-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  fresh-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: containermgmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d containermgmt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/containermgmt_test
      DISABLE_SCHEDULER: "1"
      ENVIRONMENT: test
      BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
      JWT_SECRET_KEY: test-jwt-secret-key-not-for-production
      MEDIA_SIGNING_KEY: test-media-signing-key-not-for-production
      CMA_CGM_WEBHOOK_SECRET: test-webhook-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Start from an empty database
        run: |
          python -c "from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ['DATABASE_URL']); c=e.connect(); c.execute(text('DROP SCHEMA IF EXISTS containermgmt CASCADE')); c.execute(text('DROP SCHEMA IF EXISTS usercredentials CASCADE')); c.commit(); c.close()"
          python -m uvicorn containerMgmt:app --host 127.0.0.1 --port 9000 > fresh-install.log 2>&1 &
          echo $! > fresh-install.pid
      - name: Verify health and bootstrap administrator
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health > /dev/null; then break; fi
            if ! kill -0 $(cat fresh-install.pid) 2>/dev/null; then cat fresh-install.log; exit 1; fi
            sleep 2
          done
          TOKEN=$(curl --fail --silent -X POST http://127.0.0.1:9000/token -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'username=admin' --data-urlencode 'password=ci-bootstrap-password' | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl --fail --silent http://127.0.0.1:9000/getUsers -H "Authorization: Bearer $TOKEN" > /dev/null
          grep -q "Application startup complete" fresh-install.log
      - name: Show startup log on failure
        if: failure()
        run: cat fresh-install.log
